name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/

  # Portable Windows app: download "PM-Local-windows" from the run's Artifacts.
  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Smoke-test the packaged app
        shell: bash
        run: PM_LOCAL_EXE="$PWD/dist/win-unpacked/PM Local.exe" npx playwright test e2e/packaged.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-results
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: PM-Local-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
